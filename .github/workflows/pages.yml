name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated website
        run: |
          test -s dist/index.html
          test -s dist/research/index.html
          test -s dist/assets/css/site.css
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages Source must be GitHub Actions. Change it at https://github.com/${GITHUB_REPOSITORY}/settings/pages to prevent the legacy Jekyll deployment from overwriting this site."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
